---
- summary: |
    Неровная область клика и границы рамки карточки товара в каталоге
  environment: |
    Google Chrome 147.0.7727.117
    ОС Windows 11 Домашняя 25H2
  steps-to-reproduce: |
    1. Перейти в каталог товаров на главной странице.
    2. В DevTools выявить кликабельную область (hover/focus) карточки товара.
  expected-result: |
    Рамка карточки товара ровная, область клика строго совпадает с визуальными границами карточки.
  actual-result: |
    Границы рамки карточки товара неровные, кликабельная область выходит за пределы карточки / смещена.

- summary: |
    Хэштег категории на странице товара не работает (некликабелен)
  environment: |
    Google Chrome 147.0.7727.117
    ОС Windows 11 Домашняя 25H2
  steps-to-reproduce: |
    1. Открыть детальную страницу любого товара (например, "Red Lipstick").
    2. Попытаться кликнуть по хэштегу категории (например, "#beauty").
  expected-result: |
    Хэштег кликабелен, происходит переход в соответствующую категорию каталога.
  actual-result: |
    Хэштег некликабелен (отсутствует ссылка), переход в категорию не происходит.

- summary: |
    Поиск и фильтры каталога (по категории, производителю, цене) работают только в пределах текущей страницы пагинации
  environment: |
    Google Chrome 147.0.7727.117
    ОС Windows 11 Домашняя 25H2
  steps-to-reproduce: |
    1. Открыть каталог товаров.
    2. Ввести поисковый запрос или применить любой фильтр (выбрать категорию "beauty", бренда "Essence" или диапазон цен).
    3. Проверить результаты выдачи на всех страницах каталога.
  expected-result: |
    Поиск и фильтрация выполняются по всей базе товаров каталога.
  actual-result: |
    Поиск и фильтры применяются только к товарам, отображаемым на активной странице пагинации, вместо всего каталога.

- summary: |
    Нарушение верстки элементов товара и смещение сетки в корзине
  environment: |
    Google Chrome 147.0.7727.117
    ОС Windows 11 Домашняя 25H2
  steps-to-reproduce: |
    1. Добавить несколько товаров в корзину и перейти на страницу корзины.
    2. Удалить один товар из списка или изменить количество.
  expected-result: |
    Список товаров аккуратно перестраивается, отступы и границы блоков сохраняют ровное выравнивание.
  actual-result: |
    Верстка элементов корзины нарушается: блоки сдвигаются, отступы между строками отображаются неровно.

- summary: |
    Ошибка 500 (Internal Server Error) при попытке перехода на страницу оплаты при оформлении заказа
  environment: |
    Google Chrome 147.0.7727.117
    ОС Windows 11 Домашняя 25H2
  steps-to-reproduce: |
    1. Добавить любой товар из каталога в корзину.
    2. Перейти в корзину.
    3. Нажать кнопку «Оформить заказ».
  expected-result: |
    Происходит переход на страницу оплаты / формы ввода данных.
  actual-result: |
    Возникает ошибка сервера (Error 500), переход на страницу оплаты не происходит, окно подтверждения недоступно.

- summary: |
    Отсутствует иконка флага в меню переключения на английский язык ("English")
  environment: |
    Google Chrome 147.0.7727.117
    ОС Windows 11 Домашняя 25H2
  steps-to-reproduce: |
    1. Нажать на выпадающее меню переключения языка.
    2. Навести курсор на пункт «English».
  expected-result: |
    Рядом с наименованием каждого языка отображается соответствующая иконка флага.
  actual-result: |
    Напротив пункта «English» отсутствует изображение флага.

- summary: |
    Смена языка интерфейса не переводит названия и описания товаров
  environment: |
    Google Chrome 147.0.7727.117
    ОС Windows 11 Домашняя 25H2
  steps-to-reproduce: |
    1. Нажать на меню переключения языка.
    2. Выбрать язык «Russian».
    3. Проверить карточки товаров в каталоге.
  expected-result: |
    Названия и описания товаров динамически переводятся на выбранный язык.
  actual-result: |
    Локализация товаров не меняется, названия и описания остаются на английском языке.

- summary: |
    Нарушение адаптивной верстки на мобильных устройствах: перекрытие элементов UI
  environment: |
    Google Chrome 147.0.7727.117
    Режим эмуляции DevTools (iPhone SE, 375x667)
  steps-to-reproduce: |
    1. Открыть каталог товаров в режиме эмуляции мобильного экрана (ширина 375px).
    2. Просмотреть карточки товаров и шапку сайта.
  expected-result: |
    Интерфейс корректно перестраивается под ширину экрана: отсутствуют наложения текста и кнопок, отсутствует горизонтальная прокрутка.
  actual-result: |
    Кнопка «В корзину» накладывается на блок с ценой товара, меню поиска перекрывает логотип в шапке, появляется горизонтальный скролл страницы.
