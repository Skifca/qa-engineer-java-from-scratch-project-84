---
- summary: |
    Отсутствует отображение рейтинга товара в карточках каталога
  environment: |
    Google Chrome 147.0.7727.117
    ОС Windows 11 Домашняя 25H2
  steps-to-reproduce: |
    1. Перейти на главную страницу каталога товаров.
    2. Просмотреть содержимое карточек товаров (например, "Essence Mascara Lash Princess").
  expected-result: |
    В карточке каждого товара отображаются название, рейтинг, цена со скидкой, цена без скидки и кнопка добавления в корзину.
  actual-result: |
    Рейтинг товара полностью отсутствует в карточках каталога.

- summary: |
    Некорректная работа перехода по хэштегу категории со страницы товара
  environment: |
    Google Chrome 147.0.7727.117
    ОС Windows 11 Домашняя 25H2
  steps-to-reproduce: |
    1. Открыть детальную страницу товара (например, "Red Lipstick").
    2. Найти хэштег категории "#beauty".
    3. Кликнуть по хэштегу "#beauty".
  expected-result: |
    Осуществлен переход в каталог с примененным фильтром категории "beauty", отображаются только товары этой категории.
  actual-result: |
    Клик по хэштегу не выполняет переход в каталог к выбранной категории.

- summary: |
    Смена языка интерфейса на русский не переводит элементы и контент сайта
  environment: |
    Google Chrome 147.0.7727.117
    ОС Windows 11 Домашняя 25H2
  steps-to-reproduce: |
    1. Нажать на меню переключения языка в шапке сайта.
    2. Выбрать язык «Russian».
    3. Проверить элементы шапки, каталога, карточки товаров и корзину.
  expected-result: |
    Все элементы интерфейса, названия и описания корректно отображаются на русском языке.
  actual-result: |
    Локализация интерфейса и карточек товаров не меняется, элементы остаются на английском языке.

- summary: |
    Ошибка 500 (Internal Server Error) при попытке оформления заказа из корзины
  environment: |
    Google Chrome 147.0.7727.117
    ОС Windows 11 Домашняя 25H2
  steps-to-reproduce: |
    1. Добавить любой товар из каталога в корзину.
    2. Перейти в корзину.
    3. Нажать кнопку «Оформить заказ».
  expected-result: |
    Заказ успешно оформляется, пользователь получает подтверждение, корзина очищается.
  actual-result: |
    Возникает ошибка сервера (Error 500), заказ не оформляется, корзина остается неочищенной.

- summary: |
    Нарушение адаптивной верстки на мобильных устройствах: перекрытие элементов UI
  environment: |
    Google Chrome 147.0.7727.117
    Режим эмуляции DevTools (iPhone SE, 375x667)
  steps-to-reproduce: |
    1. Открыть каталог товаров в режиме эмуляции мобильного экрана (ширина 375px).
    2. Просмотреть карточки товаров и шапку сайта.
  expected-result: |
    Интерфейс корректно перестраивается под ширину экрана отсутствуют наложения текста и кнопок, отсутствует горизонтальная прокрутка.
  actual-result: |
    Кнопка «В корзину» накладывается на блок с ценой товара, меню поиска перекрывает логотип в шапке, появляется горизонтальный скролл страницы.
    Скриншот дефекта: [mobile-layout-overlap.png](screenshots/mobile-layout-overlap.png)
