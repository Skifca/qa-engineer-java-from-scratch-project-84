---
- summary: |
    Сброс параметров поиска и фильтров (категория, производитель, текстовый поиск) при переключении страниц пагинации
  environment: |
    Google Chrome 147.0.7727.117
    ОС Windows 11 Домашняя 25H2
  steps-to-reproduce: |
    1. Применить любой фильтр каталога (выбрать категорию, производителя) или ввести запрос в поле поиска по ключевому слову.
    2. Нажать на кнопку «Следующая», чтобы переключиться на следующую страницу пагинации.
    3. Проверить отображаемую выдачу товаров и состояние фильтров.
  expected-result: |
    Параметры поиска и фильтрации сохраняются, на следующей странице отображается корректно отфильтрованный список товаров.
  actual-result: |
    При переходе на следующую страницу результаты поиска/фильтрации сбрасываются, и отображается общий каталог всех товаров.

- summary: |
    Отсутствует иконка флага в меню переключения на английский язык ("English")
  environment: |
    Google Chrome 147.0.7727.117
    ОС Windows 11 Домашняя 25H2
  steps-to-reproduce: |
    1. Нажать на выпадающее меню переключения языка.
    2. Навести курсор на пункт «English».
  expected-result: |
    Рядом с наименованием каждого языка отображается соответствующая иконка флага.
  actual-result: |
    Напротив пункта «English» отсутствует изображение флага.

- summary: |
    Смена языка интерфейса не переводит названия и описания товаров
  environment: |
    Google Chrome 147.0.7727.117
    ОС Windows 11 Домашняя 25H2
  steps-to-reproduce: |
    1. Нажать на меню переключения языка.
    2. Выбрать язык «Russian» или «Spanish».
    3. Проверить карточки товаров в каталоге.
  expected-result: |
    Названия и описания товаров динамически переводятся на выбранный язык.
  actual-result: |
    Локализация товаров не меняется, названия и описания остаются на английском языке.

- summary: |
    Сброс выбранного языка интерфейса при перезагрузке страницы
  environment: |
    Google Chrome 147.0.7727.117
    ОС Windows 11 Домашняя 25H2
  steps-to-reproduce: |
    1. Выбрать любой язык интерфейса, отличный от английского (например, «Russian»).
    2. Обновить страницу браузера (F5 или Ctrl+R).
  expected-result: |
    После обновления страницы выбранный язык сохраняется.
  actual-result: |
    Выбранный язык сбрасывается, страница возвращается к языку по умолчанию (English).

- summary: |
    Ошибка 500 (Internal Server Error) при попытке оформления заказа из корзины
  environment: |
    Google Chrome 147.0.7727.117
    ОС Windows 11 Домашняя 25H2
  steps-to-reproduce: |
    1. Добавить любой товар из каталога в корзину.
    2. Перейти в корзину.
    3. Нажать кнопку «Оформить заказ».
  expected-result: |
    Заказ успешно оформляется, пользователь получает подтверждение, корзина очищается.
  actual-result: |
    Возникает ошибка сервера (Error 500), заказ не оформляется, корзина остается неочищенной.

- summary: |
    Нарушение адаптивной верстки на мобильных устройствах: перекрытие элементов UI
  environment: |
    Google Chrome 147.0.7727.117
    Режим эмуляции DevTools (iPhone SE, 375x667)
  steps-to-reproduce: |
    1. Открыть каталог товаров в режиме эмуляции мобильного экрана (ширина 375px).
    2. Просмотреть карточки товаров и шапку сайта.
  expected-result: |
    Интерфейс корректно перестраивается под ширину экрана: отсутствуют наложения текста и кнопок, отсутствует горизонтальная прокрутка.
  actual-result: |
    Кнопка «В корзину» накладывается на блок с ценой товара, меню поиска перекрывает логотип в шапке, появляется горизонтальный скролл страницы.
    Скриншот дефекта: screenshots/mobile-layout-overlap.png

- summary: |
    Отсутствует возможность сброса выбранного значения в фильтре «Категория»
  environment: |
    Google Chrome 147.0.7727.117
    ОС Windows 11 Домашняя 25H2
  steps-to-reproduce: |
    1. Выбрать любую категорию в выпадающем списке фильтра (например, «beauty»).
    2. Попытаться отменить выбор категории, чтобы снова отобразить товары всех категорий.
  expected-result: |
    В выпадающем списке есть пустой элемент (или опция «Все категории»), позволяющий сбросить фильтрацию.
  actual-result: |
    В списке отсутствует пустая строчка / опция сброса, отменить выбор категории невозможно без перезагрузки страницы.

- summary: |
    Логотип магазина в шапке сайта не содержит ссылку для перехода на главную страницу
  environment: |
    Google Chrome 147.0.7727.117
    ОС Windows 11 Домашняя 25H2
  steps-to-reproduce: |
    1. Перейти на любую страницу сайта, отличную от главной (например, в корзину).
    2. Кликнуть по логотипу магазина в шапке сайта.
  expected-result: |
    Логотип кликабелен и перенаправляет пользователя на главную страницу сайта.
  actual-result: |
    Логотип не кликабелен (отсутствует ссылка href), переход на главную страницу не происходит.
