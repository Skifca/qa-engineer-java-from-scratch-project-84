---
- summary: |
    Ошибки верстки и отображения обязательных элементов в карточке товара в каталоге
  environment: |
    Google Chrome 147.0.7727.117
    ОС Windows 11 Домашняя 25H2
  steps-to-reproduce: |
    1. Открыть главную страницу каталога товаров.
    2. Осмотреть карточки товаров в общей сетке каталога.
  expected-result: |
    Каждая карточка товара содержит название, изображение, цену, рейтинг и кнопку добавления в корзину. Элементы не перекрывают друг друга.
  actual-result: |
    В карточках товаров происходит наложение цены на кнопку «В корзину», у некоторых товаров отсутствует отображение цены.

- summary: |
    Неработающая ссылка/ошибка при переходе по хэштегу категории со страницы товара
  environment: |
    Google Chrome 147.0.7727.117
    ОС Windows 11 Домашняя 25H2
  steps-to-reproduce: |
    1. Открыть детальную страницу любого товара.
    2. Кликнуть по хэштегу/тегу категории товара.
  expected-result: |
    Происходит переход в каталог с фильтрацией товаров по выбранному хэштегу.
  actual-result: |
    Клик по хэштегу не вызывает перехода или перенаправляет на страницу ошибки 404.

- summary: |
    Поиск по существующему ключевому слову не выводит релевантные товары в каталоге
  environment: |
    Google Chrome 147.0.7727.117
    ОС Windows 11 Домашняя 25H2
  steps-to-reproduce: |
    1. Перейти на главную страницу каталога.
    2. Ввести в поле поиска корректное наименование существующего товара.
    3. Нажать Enter или кнопку поиска.
  expected-result: |
    В выдаче отображаются товары, соответствующие ключевому слову.
  actual-result: |
    Результаты поиска пустые или содержат товары, не относящиеся к запросу.

- summary: |
    Выбор категории в фильтре не обновляет список товаров в каталоге
  environment: |
    Google Chrome 147.0.7727.117
    ОС Windows 11 Домашняя 25H2
  steps-to-reproduce: |
    1. Открыть каталог товаров.
    2. Выбрать любую категорию в боковом блоке фильтрации.
    3. Применить фильтр.
  expected-result: |
    Отображаются только товары, принадлежащие выбранной категории.
  actual-result: |
    Фильтрация не срабатывает, в списке остаются товары из всех категорий.

- summary: |
    В блоке фильтрации «Производитель» отображаются только бренды с текущей страницы пагинации, а не всего каталога
  environment: |
    Google Chrome 147.0.7727.117
    ОС Windows 11 Домашняя 25H2
  steps-to-reproduce: |
    1. Перейти в каталог товаров на главную страницу.
    2. Просмотреть список брендов в боковом блоке фильтрации «Производитель».
    3. Сравнить доступные бренды в фильтре с брендами товаров на других страницах пагинации.
  expected-result: |
    В блоке фильтрации «Производитель» выводятся все бренды, представленные во всём каталоге товаров.
  actual-result: |
    Список брендов в фильтре формируется только из товаров текущей активной страницы. Бренды товаров с других страниц каталога отсутствуют в списке.

- summary: |
    Некорректная фильтрация по максимальной цене: при вводе предлагаемого максимума товары не выводятся
  environment: |
    Google Chrome 147.0.7727.117
    ОС Windows 11 Домашняя 25H2
  steps-to-reproduce: |
    1. Открыть каталог товаров и посмотреть на автоматически предлагаемое максимальное значение цены в фильтре.
    2. Ввести это же максимальное значение в поле фильтрации верхней границы цены.
    3. Применить фильтр.
  expected-result: |
    В списке вывода отображаются товары, чья стоимость меньше или равна указанному максимуму.
  actual-result: |
    Фильтр возвращает пустую выдачу товаров.

- summary: |
    Нарушение верстки списка и итоговой суммы при удалении одного товара из корзины
  environment: |
    Google Chrome 147.0.7727.117
    ОС Windows 11 Домашняя 25H2
  steps-to-reproduce: |
    1. Добавить несколько разых товаров в корзину и открыть ее.
    2. Нажать на иконку удаления (крестик/мусорку) возле одного товара.
  expected-result: |
    Выбранный товар удаляется из списка, итоговая сумма пересчитывается, верстка страницы сохраняется корректной.
  actual-result: |
    Товар не удаляется или сдвигаются/накладываются друг на друга элементы остальных товаров и итоговая стоимость.

- summary: |
    Ошибка при попытке перехода на страницу оплаты после нажатия «Оформить заказ»
  environment: |
    Google Chrome 147.0.7727.117
    ОС Windows 11 Домашняя 25H2
  steps-to-reproduce: |
    1. Добавить товар в корзину и перейти к оформлению заказа.
    2. Заполнить все обязательные поля формы оформления.
    3. Нажать кнопку «Перейти к оплате» / «Оформить заказ».
  expected-result: |
    Происходит перенаправление на защищенную страницу оплаты платёжного шлюза.
  actual-result: |
    Переход не происходит, на экране отображается ошибка страницы (404/500) или форма зависает без реакций.

- summary: |
    Модальное окно с подтверждением заказа не закрывается при нажатии на крестик
  environment: |
    Google Chrome 147.0.7727.117
    ОС Windows 11 Домашняя 25H2
  steps-to-reproduce: |
    1. Завершить процедуру оформления заказа до появления модального окна «Заказ успешно оформлен».
    2. Нажать на иконку крестика (Закрыть) в верхнем углу модального окна.
  expected-result: |
    Модальное окно закрывается, пользователь остаётся на текущей странице или перенаправляется в каталог.
  actual-result: |
    Клик по крестику не вызывает никакой реакции, окно остается открытым поверх интерфейса.

- summary: |
    Сбрасывается выбранный язык интерфейса при нажатии на кнопку «В магазин»
  environment: |
    Google Chrome 147.0.7727.117
    ОС Windows 11 Домашняя 25H2
  steps-to-reproduce: |
    1. Переключить язык интерфейса на «Russian».
    2. Перейти в корзину или на детальную страницу товара.
    3. Нажать кнопку «В магазин» / «Продолжить покупки».
  expected-result: |
    Происходит переход в каталог с сохранением выбранного русского языка.
  actual-result: |
    Язык интерфейса автоматически сбрасывается на язык по умолчанию (английский).

- summary: |
    Нарушение адаптивной верстки и перекрытие элементов при просмотре с мобильных устройств
  environment: |
    Google Chrome 147.0.7727.117 (Mobile Emulation / iOS Safari / Android)
    ОС Windows 11 Домашняя 25H2
  steps-to-reproduce: |
    1. Открыть сайт с мобильного устройства или включить мобильный режим отображения (DevTools).
    2. Перейти на страницу каталога товаров и пролистать меню/сетку.
  expected-result: |
    Интерфейс корректно адаптируется под ширину экрана, горизонтальная прокрутка отсутствует, все элементы читаемы и кликабельны.
  actual-result: |
    Элементы выходят за пределы экрана, появляется горизонтальный скролл, кнопки и карточки накладываются друг на друга.
