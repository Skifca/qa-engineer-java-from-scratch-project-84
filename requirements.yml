---
functional:
  - Пользователь должен иметь возможность искать товары по ключевому слову, категории или производителю
  - Пользователь должен иметь возможность фильтровать товары (по производителю, диапазону цен и наличию)
  - В карточках товаров в каталоге и на детальной странице товара должны отображаться название, рейтинг, цена без скидки и цена со скидкой
  - Пользователь должен иметь возможность просматривать каталог товаров с поддержкой пагинации (постраничной навигации)
  - На странице товара должен быть представлен хэштег/тег категории с возможностью перехода в соответствующий раздел каталога
  - Пользователь должен иметь возможность добавлять товары в корзину и продолжать выбирать товары в каталоге без принудительного перехода в корзину
  - Пользователь должен иметь возможность добавлять несколько одинаковых или разных товаров в корзину
  - Пользователь должен иметь возможность просматривать содержимое корзины, полностью очищать корзину и оформлять заказ
  - Пользователь должен иметь возможность переключать язык интерфейса
  - Сайт должен иметь полную локализацию (перевод элементов интерфейса и каталога) на русский и английский языки

non-functional:
  - Сайт должен иметь адаптивную верстку (мобильную версию) с корректным отображением элементов на узких экранах
  - Сайт должен быть протестирован на совместимость с последними версиями основных браузеров (Chrome, Firefox, Safari, Edge)
  - Сайт должен быть доступен для использования на различных типах устройств (десктоп, планшеты, мобильные телефоны)
  - Сайт должен быть разработан с учетом удобства использования (UX/UI) и оптимизирован для высокой скорости загрузки
  - Сайт должен обеспечивать безопасную обработку и защиту данных пользователей
  - Архитектура сайта должна выдерживать высокую нагрузку и трафик
  - Сайт должен быть доступен из сети Интернет напрямую (без необходимости использования VPN)

implicit:
  - При переключении языка интерфейса или обновлении страницы (F5) содержимое корзины не должно сбрасываться
  - Выбранный язык интерфейса должен сохраняться при переходе между страницами и при перезагрузке
  - При отсутствии результатов поиска или фильтрации пользователю должно выводиться понятное сообщение (Empty State)
  - При применении фильтрации или поиска их параметры должны сохраняться при переключении страниц пагинации
