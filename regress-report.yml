bugreports:
- summary: |
    Отсутствует блок пагинации при применении фильтров в каталоге
  environment: |
    Google Chrome 147.0.7727.117
    ОС Windows 11 Домашняя 25H2
  steps-to-reproduce: |
    1. Перейти в каталог товаров на главной странице.
    2. Применить любой фильтр (выбрать категорию, бренда, чекбокс "В наличии" или задать диапазон цен).
  expected-result: |
    Отфильтрованный список товаров отображается с сохранением или корректным пересчетом блока пагинации страниц.
  actual-result: |
    Блок кнопок переключения страниц (пагинация) полностью скрывается с главной страницы.

- summary: |
    Поиск по несуществующему запросу не фильтрует каталог: продолжают отображаться все товары вместо сообщения «Товары не найдены»
  environment: |
    Google Chrome 147.0.7727.117
    ОС Windows 11 Домашняя 25H2
  steps-to-reproduce: |
    1. Открыть главную страницу каталога.
    2. Ввести в поле поиска заведомо несуществующее название товара (например, "qwerty12345").
  expected-result: |
    Список товаров фильтруется. При отсутствии совпадений выдача очищается и отображается сообщение об отсутствии результатов (например, "Товары не найдены").
  actual-result: |
    Поиск не применяет фильтрацию: список товаров не очищается, на странице продолжают отображаться все товары каталога, сообщение "Товары не найдены" отсутствует.

- summary: |
    Товары не удаляются из корзины при нажатии «Очистить корзину» с последующим переходом в магазин
  environment: |
    Google Chrome 147.0.7727.117
    ОС Windows 11 Домашняя 25H2
  steps-to-reproduce: |
    1. Добавить один или несколько товаров в корзину.
    2. Перейти на страницу корзины и нажать кнопку «Очистить корзину».
    3. Нажать кнопку «В магазин».
    4. Снова открыть корзину.
  expected-result: |
    Состояние очищенной корзины сохраняется, список товаров пуст.
  actual-result: |
    Товары остаются в корзине, операция очистки сбрасывается.

- summary: |
    Сбрасывается выбранный язык интерфейса при нажатии на кнопку «В магазин»
  environment: |
    Google Chrome 147.0.7727.117
    ОС Windows 11 Домашняя 25H2
  steps-to-reproduce: |
    1. Переключить язык интерфейса на «Russian».
    2. Перейти в корзину или на детальную страницу товара.
    3. Нажать кнопку «В магазин» / «Продолжить покупки».
  expected-result: |
    Происходит переход в каталог с сохранением выбранного русского языка.
  actual-result: |
    Язык интерфейса автоматически сбрасывается на язык по умолчанию (английский).

- summary: |
    В блоке фильтрации «Производитель» отображаются только бренды с текущей страницы пагинации, а не всего каталога
  environment: |
    Google Chrome 147.0.7727.117
    ОС Windows 11 Домашняя 25H2
  steps-to-reproduce: |
    1. Перейти в каталог товаров на главную страницу.
    2. Просмотреть список брендов в боковом блоке фильтрации «Производитель».
    3. Сравнить доступные бренды в фильтре с брендами товаров на других страницах пагинации.
  expected-result: |
    В блоке фильтрации «Производитель» выводятся все бренды, представленные во всём каталоге товаров.
  actual-result: |
    Список брендов в фильтре формируется только из товаров текущей активной страницы. Бренды товаров с других страниц каталога отсутствуют в списке.
