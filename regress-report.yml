bugreports:
  - summary: |
      Ошибки верстки и отображения обязательных элементов в карточке товара в каталоге
    environment: |
      Google Chrome 147.0.7727.117
      ОС Windows 11 Домашняя 25H2
    steps-to-reproduce: |
      1. Открыть главную страницу каталога товаров.
      2. Осмотреть карточки товаров в общей сетке каталога.
    expected-result: |
      Каждая карточка товара содержит название, изображение, цену, рейтинг и кнопку добавления в корзину. Элементы не перекрывают друг друга.
    actual-result: |
      Иконка и обозначение рейтинга полностью отсутствуют (возле цены выводится только неинформативное числовое значение).

  - summary: |
      Поиск по несуществующему запросу не фильтрует каталог: продолжают отображаться все товары вместо сообщения «Товары не найдены»
    environment: |
      Google Chrome 147.0.7727.117
      ОС Windows 11 Домашняя 25H2
    steps-to-reproduce: |
      1. Открыть главную страницу каталога.
      2. Ввести в поле поиска заведомо несуществующее название товара (например, "qwerty12345").
    expected-result: |
      Список товаров фильтруется. При отсутствии совпадений выдача очищается и отображается сообщение об отсутствии результатов ("Товары не найдены").
    actual-result: |
      Поиск не применяет фильтрацию: список товаров не очищается, на странице продолжают отображаться все товары каталога, сообщение "Товары не найдены" отсутствует.

  - summary: |
      Некорректная фильтрация по максимальной цене: при вводе предлагаемого максимума товары не выводятся
    environment: |
      Google Chrome 147.0.7727.117
      ОС Windows 11 Домашняя 25H2
    steps-to-reproduce: |
      1. Открыть каталог товаров и посмотреть на автоматически предлагаемое максимальное значение цены в фильтре.
      2. Ввести это же максимальное значение в поле фильтрации верхней границы цены.
      3. Применить фильтр.
    expected-result: |
      В списке вывода отображаются товары, чья стоимость меньше или равна указанному максимуму.
    actual-result: |
      Фильтр возвращает пустую выдачу товаров.

  - summary: |
      Фильтр по наличию товара выводит позиции, которых нет в наличии
    environment: |
      Google Chrome 147.0.7727.117
      ОС Windows 11 Домашняя 25H2
    steps-to-reproduce: |
      1. Перейти в каталог товаров.
      2. В боковом блоке фильтрации выбрать фильтр «В наличии».
      3. Проверить статус товаров в полученном списке.
    expected-result: |
      Отображаются только товары со статусом «В наличии».
    actual-result: |
      В выдаче остаются товары со статусом «Нет в наличии» / «Под заказ».

   - summary: |
      Ошибка 500 (Internal Server Error) при попытке перехода на страницу оплаты при оформлении заказа
    environment: |
      Google Chrome 147.0.7727.117
      ОС Windows 11 Домашняя 25H2
    steps-to-reproduce: |
      1. Добавить любой товар из каталога в корзину.
      2. Перейти в корзину.
      3. Нажать кнопку «Оформить заказ».
    expected-result: |
      Происходит переход на страницу оплаты / формы ввода платежных данных без ошибок сервера.
    actual-result: |
      Возникает ошибка сервера (Error 500), переход на страницу оплаты не происходит.

  - summary: |
      Модальное окно с подтверждением заказа не закрывается при нажатии на крестик
    environment: |
      Google Chrome 147.0.7727.117
      ОС Windows 11 Домашняя 25H2
    steps-to-reproduce: |
      1. Завершить процедуру оформления заказа до появления модального окна «Заказ успешно оформлен».
      2. Нажать на иконку крестика (Закрыть) в верхнем углу модального окна.
    expected-result: |
      Модальное окно закрывается, пользователь остаётся на текущей странице или перенаправляется в каталог.
    actual-result: |
      Клик по крестику не вызывает никакой реакции, окно остается открытым поверх интерфейса.

  - summary: |
      Смена языка интерфейса на русский не переводит элементы и контент сайта
    environment: |
      Google Chrome 147.0.7727.117
      ОС Windows 11 Домашняя 25H2
    steps-to-reproduce: |
      1. Нажать на меню переключения языка в шапке сайта.
      2. Выбрать язык «Russian».
      3. Проверить элементы шапки, каталога, карточки товаров и корзину.
    expected-result: |
      Все элементы интерфейса, названия и описания корректно отображаются на русском языке.
    actual-result: |
      Элементы интерфейса переведены, однако названия товаров, их описания и наименования брендов в фильтре остаются на английском языке.

  - summary: |
      Отсутствует блок пагинации при применении фильтров в каталоге
    environment: |
      Google Chrome 147.0.7727.117
      ОС Windows 11 Домашняя 25H2
    steps-to-reproduce: |
      1. Перейти в каталог товаров на главной странице.
      2. Применить любой фильтр (выбрать категорию, бренда, чекбокс "В наличии" или задать диапазон цен).
    expected-result: |
      Отфильтрованный список товаров отображается с сохранением или корректным пересчетом блока пагинации страниц.
    actual-result: |
      Блок кнопок переключения страниц (пагинация) полностью скрывается с главной страницы.

  - summary: |
      Поиск по несуществующему запросу не фильтрует каталог: продолжают отображаться все товары вместо сообщения «Товары не найдены»
    environment: |
      Google Chrome 147.0.7727.117
      ОС Windows 11 Домашняя 25H2
    steps-to-reproduce: |
      1. Открыть главную страницу каталога.
      2. Ввести в поле поиска заведомо несуществующее название товара (например, "qwerty12345").
    expected-result: |
      Список товаров фильтруется. При отсутствии совпадений выдача очищается и отображается сообщение об отсутствии результатов (например, "Товары не найдены").
    actual-result: |
      Поиск не применяет фильтрацию: список товаров не очищается, на странице продолжают отображаться все товары каталога, сообщение "Товары не найдены" отсутствует.

  - summary: |
      Товары не удаляются из корзины при нажатии «Очистить корзину» с последующим переходом в магазин
   environment: |
      Google Chrome 147.0.7727.117
      ОС Windows 11 Домашняя 25H2
    steps-to-reproduce: |
      1. Добавить один или несколько товаров в корзину.
      2. Перейти на страницу корзины и нажать кнопку «Очистить корзину».
      3. Нажать кнопку «В магазин».
      4. Снова открыть корзину.
    expected-result: |
      Состояние очищенной корзины сохраняется, список товаров пуст.
    actual-result: |
      Товары остаются в корзине, операция очистки сбрасывается.

  - summary: |
      Сбрасывается выбранный язык интерфейса при нажатии на кнопку «В магазин»
    environment: |
      Google Chrome 147.0.7727.117
      ОС Windows 11 Домашняя 25H2
    steps-to-reproduce: |
      1. Переключить язык интерфейса на «Russian».
      2. Перейти в корзину или на детальную страницу товара.
      3. Нажать кнопку «В магазин» / «Продолжить покупки».
    expected-result: |
      Происходит переход в каталог с сохранением выбранного русского языка.
   actual-result: |
      Язык интерфейса автоматически сбрасывается на язык по умолчанию (английский).
