---
- summary: |
    Отображение обязательных элементов карточки товара в каталоге
  requirement: |
    В карточках товаров в каталоге должны отображаться название, рейтинг, цена без скидки и цена со скидкой
  prerequisites: |
    Открыта главная страница сайта с каталогом товаров
  test-data: |
    Карточки товаров в каталоге
  steps:
    - Перейти в каталог товаров
    - Проверить содержимое карточек товаров
  expected-result: |
    В каждой карточке товара отображаются: название, рейтинг, цена со скидкой, цена без скидки и кнопка добавления в корзину

- summary: |
    Просмотр подробной информации о товаре на детальной странице
  requirement: |
    Пользователь должен иметь возможность просматривать подробную информацию о товаре
  prerequisites: |
    Открыта страница каталога
  test-data: |
    Товар: "Red Lipstick"
  steps:
    - Нажать на карточку товара "Red Lipstick"
  expected-result: |
    Открылась страница товара, на которой отображены название, рейтинг, цена со скидкой, цена без скидки и детальное описание

- summary: |
    Переход в категорию по хэштегу со страницы товара
  requirement: |
    На странице товара должен быть представлен хэштег/тег категории с возможностью перехода в соответствующий раздел
  prerequisites: |
    Открыта детальная страница товара "Red Lipstick"
  test-data: |
    Хэштег категории: "#beauty"
  steps:
    - Найти хэштег категории на странице товара
    - Кликнуть по хэштегу "#beauty"
  expected-result: |
    Осуществлен переход в каталог к категории "beauty", отображаются товары данной категории

- summary: |
    Поиск товаров по ключевому слову
  requirement: |
    Пользователь должен иметь возможность искать товары по ключевому слову
  prerequisites: |
    Открыта главная страница сайта
  test-data: |
    Поисковый запрос: "Red Lipstick"
  steps:
    - Ввести "Red Lipstick" в поле поиска
    - Нажать клавишу Enter или кнопку поиска
  expected-result: |
    На странице отображаются только те товары, в названии которых присутствует запрос "Red Lipstick"

- summary: |
    Поиск товаров по несуществующему запросу (негативный тест)
  requirement: |
    При отсутствии результатов поиска пользователю должно выводиться понятное сообщение
  prerequisites: |
    Открыта главная страница сайта
  test-data: |
    Поисковый запрос: "qwerty12345!@#"
  steps:
    - Ввести "qwerty12345!@#" в поле поиска
    - Нажать клавишу Enter или кнопку поиска
  expected-result: |
    Товары не найдены, на странице отображается понятное информационное сообщение ("Товары не найдены")

- summary: |
    Фильтрация товаров по категории
  requirement: |
    Пользователь должен иметь возможность фильтровать товары по категории
  prerequisites: |
    Открыта страница каталога со всеми товарами
  test-data: |
    Категория: "beauty"
  steps:
    - Открыть выпадающий список/меню категорий в блоке фильтров
    - Выбрать из списка категорию "beauty"
  expected-result: |
    В списке товаров отображаются только товары, принадлежащие к категории "beauty"

- summary: |
    Фильтрация товаров по производителю
  requirement: |
    Пользователь должен иметь возможность фильтровать товары по производителю
  prerequisites: |
    Открыта страница каталога
  test-data: |
    Производитель: "Essence"
  steps:
    - Открыть блок фильтрации по производителям
    - Выбрать производителя "Essence"
  expected-result: |
    В списке товаров отображаются только товары бренда "Essence"

- summary: |
    Фильтрация товаров по диапазону цен
  requirement: |
    Пользователь должен иметь возможность фильтровать товары по цене
  prerequisites: |
    Открыта страница каталога
  test-data: |
    Диапазон цен: от 10 до 50
  steps:
    - Задать минимальную цену "10" и максимальную цену "50" в полях фильтра цены
    - Применить фильтр
  expected-result: |
    В каталоге отображаются только товары, стоимость которых находится в диапазоне от 10 до 50

- summary: |
    Фильтрация товаров по наличию
  requirement: |
    Пользователь должен иметь возможность фильтровать товары по наличию
  prerequisites: |
    Открыта страница каталога
  test-data: |
    Фильтр: "В наличии"
  steps:
    - Установить чекбокс / переключатель "В наличии"
  expected-result: |
    В списке товаров отображаются только позиции, доступные для покупки

- summary: |
    Навигация по страницам каталога (пагинация)
  requirement: |
    Пользователь должен иметь возможность просматривать каталог товаров с поддержкой пагинации
  prerequisites: |
    Открыта первая страница каталога
  test-data: |
    Переход на страницу 2
  steps:
    - Прокрутить страницу вниз до блока пагинации
    - Нажать кнопку перехода на следующую страницу (2)
  expected-result: |
    Осуществлен переход на страницу 2 каталога, список товаров обновился

- summary: |
    Успешное добавление одного товара в корзину из каталога
  requirement: |
    Пользователь должен иметь возможность добавлять товары в корзину и продолжать выбор в каталоге
  prerequisites: |
    Открыта главная страница сайта с каталогом товаров
  test-data: |
    Товар: "Red Lipstick"
  steps:
    - Нажать кнопку "В корзину" на карточке товара "Red Lipstick"
    - Убедиться, что произошло добавление без принудительного перехода в корзину
    - Нажать на кнопку "Корзина" в шапке сайта
  expected-result: |
    В корзине отображается товар "Red Lipstick" в количестве 1 шт.

- summary: |
    Добавление нескольких экземпляров одного и того же товара в корзину
  requirement: |
    Пользователь должен иметь возможность добавлять несколько одинаковых товаров в корзину
  prerequisites: |
    Открыт каталог товаров
  test-data: |
    Товар: "Red Lipstick", Количество: 3
  steps:
    - Нажать кнопку "В корзину" на карточке товара "Red Lipstick" 3 раза
    - Перейти в корзину
  expected-result: |
    В корзине отображается позиция "Red Lipstick" с количеством 3 шт. и корректно пересчитанной суммой

- summary: |
    Добавление нескольких разных товаров в корзину
  requirement: |
    Пользователь должен иметь возможность добавлять несколько разных товаров в корзину
  prerequisites: |
    Открыт каталог товаров
  test-data: |
    Товары: "Red Lipstick", "Mascara"
  steps:
    - Нажать кнопку "В корзину" у товара "Red Lipstick"
    - Нажать кнопку "В корзину" у товара "Mascara"
    - Перейти в корзину
  expected-result: |
    В корзине отображаются два разных товара: "Red Lipstick" (1 шт.) и "Mascara" (1 шт.)

- summary: |
    Успешное удаление одного товара из корзины
  requirement: |
    Пользователь должен иметь возможность удалить товар из корзины
  prerequisites: |
    В корзину добавлен товар "Red Lipstick", открыта страница корзины
  test-data: |
    Товар в корзине: "Red Lipstick"
  steps:
    - Нажать кнопку удаления рядом с товаром "Red Lipstick"
  expected-result: |
    Товар "Red Lipstick" удален, список товаров обновлен

- summary: |
    Полная очистка корзины
  requirement: |
    Пользователь должен иметь возможность полностью очистить корзину
  prerequisites: |
    В корзине находятся несколько товаров ("Red Lipstick", "Mascara")
  test-data: |
    Кнопка "Очистить корзину"
  steps:
    - Перейти в корзину
    - Нажать кнопку "Очистить корзину"
  expected-result: |
    Все товары удалены из корзины, отображается состояние "Корзина пуста"

- summary: |
    Оформление и успешная покупка товара из корзины
  requirement: |
    Пользователь должен иметь возможность оформить заказ из корзины
  prerequisites: |
    В корзину добавлен товар "Red Lipstick", открыта корзина
  test-data: |
    Данные заказа
  steps:
    - Перейти в корзину
    - Нажать кнопку "Оформить заказ"
    - Подтвердить оформление
  expected-result: |
    Заказ успешно оформлен, выводятся сообщение с подтверждением заказа, корзина очищается

- summary: |
    Переключение языка интерфейса на английский и проверка локализации всех разделов
  requirement: |
    Сайт должен иметь локализацию на английский язык
  prerequisites: |
    Открыта страница сайта на русском языке
  test-data: |
    Выбор языка: "English"
  steps:
    - Нажать на кнопку переключения языка в шапке сайта
    - Выбрать "English"
    - Проверить элементы шапки, подвала и каталога
    - Перейти на страницу любого товара
    - Перейти в корзину
  expected-result: |
    Все элементы интерфейса (шапка, меню, карточки товаров, кнопки, корзина, подвал) корректно отображаются на английском языке

- summary: |
    Переключение языка интерфейса на русский и проверка локализации всех разделов
  requirement: |
    Сайт должен иметь локализацию на русский язык
  prerequisites: |
    Открыта страница сайта на английском языке
  test-data: |
    Выбор языка: "Russian"
  steps:
    - Нажать на кнопку переключения языка в шапке сайта
    - Выбрать "Russian"
    - Проверить элементы шапки, подвала и каталога
    - Перейти на страницу любого товара
    - Перейти в корзину
  expected-result: |
    Все элементы интерфейса (шапка, меню, карточки товаров, кнопки, корзина, подвал) корректно отображаются на русском языке

- summary: |
    Проверка отображения и работы функций в разных браузерах (кроссбраузерность)
  requirement: |
    Сайт должен быть протестирован на совместимость с последними версиями браузеров
  prerequisites: |
    Браузеры: Google Chrome, Firefox, Safari/Edge
  test-data: |
    Каталог и оформление заказа
  steps:
    - Открыть сайт последовательно в Google Chrome, Firefox и Safari/Edge
    - Выполнить базовый сценарий: поиск, добавление в корзину, переход в корзину
  expected-result: |
    Интерфейс и весь функционал сайта корректно работают во всех тестируемых браузерах без версточных багов

- summary: |
    Проверка верстки и функциональности на мобильном устройстве (адаптивность)
  requirement: |
    Сайт должен иметь мобильную версию и быть адаптирован для узких экранов
  prerequisites: |
    Мобильное устройство или эмулятор DevTools (ширина экрана <= 480px)
  test-data: |
    Разрешение экрана: 375x667 (iPhone)
  steps:
    - Открыть сайт на мобильном устройстве / в эмуляторе
    - Проверить отображение каталога, шапки, кнопок и корзины
    - Выполнить добавление товара в корзину
  expected-result: |
    Интерфейс корректно адаптирован: горизонтальный скролл отсутствует, элементы не накладываются друг на друга, все кнопки кликабельны
